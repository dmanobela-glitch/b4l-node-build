name: Build inference (7B Army - Slice 1 smoke)
# 7B-Army fleet inference, Slice 1: prove the RUNTIME works on a Linux runner.
# Prebuilt llama.cpp (fast) + validated small GGUF + a hard-timeout non-interactive smoke with diagnostics.
# CPU-only, no laptop, no secrets, public model + public llama.cpp only.
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_REPO: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
      MODEL_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cache model GGUF
        id: modelcache
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.MODEL_FILE }}-v2
      - name: Download + VALIDATE model
        run: |
          set -e
          mkdir -p models
          if [ ! -s "models/$MODEL_FILE" ]; then
            echo "downloading $MODEL_FILE ..."
            curl -L --fail --retry 5 -o "models/$MODEL_FILE" \
              "https://huggingface.co/$MODEL_REPO/resolve/main/$MODEL_FILE?download=true"
          fi
          SZ=$(stat -c%s "models/$MODEL_FILE")
          MAGIC=$(head -c 4 "models/$MODEL_FILE")
          echo "size=$SZ bytes  magic=$MAGIC"
          [ "$SZ" -gt 500000000 ] || { echo "FAIL: model too small ($SZ) - bad download"; head -c 300 "models/$MODEL_FILE"; exit 1; }
          [ "$MAGIC" = "GGUF" ] || { echo "FAIL: not a GGUF file (magic=$MAGIC)"; exit 1; }
          echo "model OK: valid GGUF, $SZ bytes"
      - name: Fetch prebuilt llama.cpp (CPU)
        run: |
          set -e
          gh release download --repo ggml-org/llama.cpp --pattern 'llama-*-bin-ubuntu-x64.tar.gz' --dir dl
          ls -la dl/
          mkdir -p llama && tar -xzf dl/*.tar.gz -C llama
          CLI=$(find llama -name 'llama-cli' -type f | head -1)
          test -n "$CLI" || { echo "FAIL: no llama-cli in release"; find llama -type f | head -20; exit 1; }
          chmod +x "$CLI"
          echo "LLAMA_CLI=$CLI" >> $GITHUB_ENV
          echo "LLAMA_DIR=$(dirname "$CLI")" >> $GITHUB_ENV
      - name: List llama binaries + version
        run: |
          export LD_LIBRARY_PATH="$LLAMA_DIR:$LD_LIBRARY_PATH"
          echo "=== binaries in the prebuilt ==="; find llama -maxdepth 2 -name 'llama-*' -type f | sed "s|.*/||" | sort -u
          echo "=== llama-cli version ==="; "$LLAMA_CLI" --version 2>&1 | head -4 || true
      - name: SMOKE - runtime runs to a clean exit (all output captured)
        timeout-minutes: 4
        run: |
          set +e
          export LD_LIBRARY_PATH="$LLAMA_DIR:$LD_LIBRARY_PATH"
          echo "=== one-shot inference; PASS = clean exit (0), not a hang. Full output below. ==="
          timeout -k 15 100 "$LLAMA_CLI" -m "models/$MODEL_FILE" \
            -p "def square(n): return" -n 24 -t 2 -c 256 -st < /dev/null > all.txt 2>&1
          RC=$?
          echo "exit_code=$RC"
          echo "=================== FULL llama output ==================="; cat all.txt; echo "========================================================"
          # 124 = SIGTERM timed out; 137 = escalated SIGKILL (llama-cli ignored SIGTERM — same hang, honest either way)
          if [ "$RC" = "124" ] || [ "$RC" = "137" ]; then echo "FAIL: hung (100s) - invocation still interactive/blocking"; exit 1; fi
          if [ "$RC" != "0" ]; then echo "FAIL: llama-cli exited $RC (see output above)"; exit 1; fi
          echo "PASS: llama.cpp loaded the model and ran to a clean exit on a CPU Linux runner. Slice 1 runtime PROVEN."
