name: Build inference (7B Army - Slice 1 smoke)
# 7B-Army fleet inference, Slice 1: prove the RUNTIME works on a Linux runner.
# Prebuilt llama.cpp (fast) + validated small GGUF + a hard-timeout non-interactive smoke with diagnostics.
# CPU-only, no laptop, no secrets, public model + public llama.cpp only.
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MODEL_REPO: Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF
      MODEL_FILE: qwen2.5-coder-1.5b-instruct-q4_k_m.gguf
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cache model GGUF
        id: modelcache
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.MODEL_FILE }}-v2
      - name: Download + VALIDATE model
        run: |
          set -e
          mkdir -p models
          if [ ! -s "models/$MODEL_FILE" ]; then
            echo "downloading $MODEL_FILE ..."
            curl -L --fail --retry 5 -o "models/$MODEL_FILE" \
              "https://huggingface.co/$MODEL_REPO/resolve/main/$MODEL_FILE?download=true"
          fi
          SZ=$(stat -c%s "models/$MODEL_FILE")
          MAGIC=$(head -c 4 "models/$MODEL_FILE")
          echo "size=$SZ bytes  magic=$MAGIC"
          [ "$SZ" -gt 500000000 ] || { echo "FAIL: model too small ($SZ) - bad download"; head -c 300 "models/$MODEL_FILE"; exit 1; }
          [ "$MAGIC" = "GGUF" ] || { echo "FAIL: not a GGUF file (magic=$MAGIC)"; exit 1; }
          echo "model OK: valid GGUF, $SZ bytes"
      - name: Fetch prebuilt llama.cpp (CPU)
        run: |
          set -e
          gh release download --repo ggml-org/llama.cpp --pattern '*bin-ubuntu-x64*.zip' --dir dl \
            || gh release download --repo ggml-org/llama.cpp --pattern '*ubuntu*x64*.zip' --dir dl
          ls -la dl/
          unzip -o -q dl/*.zip -d llama
          CLI=$(find llama -name 'llama-cli' -type f | head -1)
          test -n "$CLI" || { echo "FAIL: no llama-cli in release"; find llama -type f | head -20; exit 1; }
          chmod +x "$CLI"
          echo "LLAMA_CLI=$CLI" >> $GITHUB_ENV
          echo "LLAMA_DIR=$(dirname "$CLI")" >> $GITHUB_ENV
      - name: SMOKE - model loads + returns tokens
        timeout-minutes: 5
        run: |
          set +e
          export LD_LIBRARY_PATH="$LLAMA_DIR:$LD_LIBRARY_PATH"
          echo "=== llama-cli version ==="; "$LLAMA_CLI" --version 2>&1 | head -3
          echo "=== running one-shot inference (hard 120s cap) ==="
          timeout 120 "$LLAMA_CLI" -m "models/$MODEL_FILE" \
            -p "Write a one-line Python function that returns the square of n." \
            -n 32 -c 512 -t 2 -no-cnv --no-display-prompt < /dev/null > out.txt 2> err.log
          RC=$?
          echo "exit=$RC"
          echo "--- stdout ---"; cat out.txt; echo "--- stderr tail ---"; tail -15 err.log; echo "--------------"
          if [ "$RC" = "124" ]; then echo "FAIL: inference hung (120s timeout) - flag/model issue"; exit 1; fi
          if [ -z "$(tr -d '[:space:]' < out.txt)" ]; then echo "FAIL: empty output (rc=$RC)"; exit 1; fi
          echo "PASS: llama.cpp loaded a coder model and returned tokens on a CPU Linux runner. Slice 1 runtime PROVEN."
