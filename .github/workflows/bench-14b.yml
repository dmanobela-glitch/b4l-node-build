name: Bench 13-14B flagship (Master GO 2026-08-21 - ONE BIG BRAIN)
# MASTER DIRECTIVE (via Laptop-Helper 2026-08-21): WE WANT ONE BIG BRAIN, NOT AN ARMY OF DUMB ONES.
# Benchmark the best 13-14B coder on one 16GiB runner vs the G20 Qwen2.5-Coder-7B-Q4 baseline
# (avg 23.5s/prompt, 12.3 tok/s, all 8 prompts correct) -> decides the FLAGSHIP model pin.
# Legs: Qwen2.5-Coder-14B-Instruct Q4_K_M (official Qwen GGUF, 8.99GB, sha-verified) =
#       the best all-round 14B coder; DeepSeek-Coder-V2-Lite-Instruct Q4_K_M (16B MoE, 2.4B active,
#       ~10.37GB) = the fast-MoE alternative. CodeLlama-13B NOT benched (obsolete: ~50 HumanEval vs
#       84+/87 for the two legs - see research in group post). SAME harness (bench_inference.py),
#       SAME 8 prompts, SAME runner class (4vCPU/16GiB), SAME llama.cpp b10545 as G20.
# Output: bench-summary.json + bench-details.jsonl per leg -> verdict vs 7B baseline.
# CPU-only, no secrets, public models. workflow_dispatch only (does NOT disturb G11 builds).
on:
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: qwen14b
            MODEL_REPO: Qwen/Qwen2.5-Coder-14B-Instruct-GGUF
            MODEL_FILE: qwen2.5-coder-14b-instruct-q4_k_m.gguf
            MODEL_SHA256: c1e659736d89ac1065fb495330fb824d94001974a4bfa78e7270e43476a8d940
            MODEL_SIZE: 8988110272
          - name: dsv2lite
            MODEL_REPO: SandLogicTechnologies/DeepSeek-Coder-V2-Lite-Instruct-GGUF
            MODEL_FILE: DeepSeek-Coder-V2-Lite-Instruct_Q4_K_M.gguf
            MODEL_SHA256: 0cd8d8e8419120cc6ac619293f26dc08ff493243fff3775a23c5a4b9eb2f3f5d
            MODEL_SIZE: 10367958112
    env:
      MODEL_REPO: ${{ matrix.MODEL_REPO }}
      MODEL_FILE: ${{ matrix.MODEL_FILE }}
      MODEL_SHA256: ${{ matrix.MODEL_SHA256 }}
      MODEL_SIZE: ${{ matrix.MODEL_SIZE }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cache model GGUF (download once per model, restore fast)
        id: modelcache
        uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ matrix.name }}-v1
      - name: Download + sha256-VALIDATE model
        run: |
          set -e
          mkdir -p models
          if [ ! -s "models/$MODEL_FILE" ]; then
            echo "downloading $MODEL_FILE ($MODEL_SIZE bytes) ..."
            curl -L --fail --retry 5 -o "models/$MODEL_FILE" \
              "https://huggingface.co/$MODEL_REPO/resolve/main/$MODEL_FILE?download=true"
          fi
          SZ=$(stat -c%s "models/$MODEL_FILE")
          MAGIC=$(head -c 4 "models/$MODEL_FILE")
          echo "size=$SZ  magic=$MAGIC  cache_hit=${{ steps.modelcache.outputs.cache-hit }}"
          [ "$SZ" -ge $MODEL_SIZE ] || { echo "FAIL: model too small ($SZ)"; exit 1; }
          [ "$MAGIC" = "GGUF" ] || { echo "FAIL: not a GGUF (magic=$MAGIC)"; exit 1; }
          ACTUAL=$(sha256sum "models/$MODEL_FILE" | cut -d' ' -f1)
          echo "sha256=$ACTUAL"
          [ "$ACTUAL" = "$MODEL_SHA256" ] || { echo "FAIL: sha256 mismatch (expected $MODEL_SHA256)"; exit 1; }
          echo "model OK: valid GGUF, $SZ bytes, sha256 verified"
      - name: Fetch prebuilt llama.cpp (CPU, pin b10545 - 'latest' has no binary assets)
        run: |
          set -e
          # tag is POSITIONAL on this gh CLI; never rely on 'latest' (v0.2.0 = asset-less, G20 lesson)
          gh release download b10545 --repo ggml-org/llama.cpp --pattern 'llama-*-bin-ubuntu-x64.tar.gz' --dir dl
          mkdir -p llama && tar -xzf dl/*.tar.gz -C llama
          CLI=$(find llama -name 'llama-cli' -type f | head -1)
          test -n "$CLI" || { echo "FAIL: no llama-cli in release"; exit 1; }
          chmod +x "$CLI"
          echo "LLAMA_CLI=$CLI" >> $GITHUB_ENV
          echo "LLAMA_DIR=$(dirname "$CLI")" >> $GITHUB_ENV
      - name: Fetch Slice-6 harness (public, pure stdlib)
        run: |
          set -e
          curl -L --fail --retry 5 -o bench_inference.py \
            "https://raw.githubusercontent.com/dmanobela-glitch/b4l-node-build/main/tools/bench_inference.py"
          python3 -c "import ast; ast.parse(open('bench_inference.py').read()); print('harness parses OK')"
          python3 bench_inference.py --selftest
      - name: Run Slice-6 harness (one-shot -st, ctx 2048, per-prompt timeout 180s for 14B)
        timeout-minutes: 45
        run: |
          set +e
          export LD_LIBRARY_PATH="$LLAMA_DIR:$LD_LIBRARY_PATH"
          echo "=== runner RAM ==="; free -m; nproc
          timeout -k 60 2100 python3 bench_inference.py --bench \
            --bin "$LLAMA_CLI" --model "models/$MODEL_FILE" \
            --max-tokens 128 --temp 0.0 --timeout 180 --out "benchout-${{ matrix.name }}"
          RC=$?
          echo "harness_rc=$RC"
          ls -la "benchout-${{ matrix.name }}" 2>/dev/null || true
          cat "benchout-${{ matrix.name }}/bench-summary.json" 2>/dev/null || echo "NO SUMMARY"
          if [ "$RC" != "0" ]; then echo "FAIL: harness exited $RC"; exit 1; fi
          echo "PASS: ${{ matrix.name }} benchmark complete"
      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.name }}
          path: benchout-${{ matrix.name }}/
          if-no-files-found: error
