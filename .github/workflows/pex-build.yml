name: Build PEX one-click (pex-win.zip / pex-linux.zip)
# Model A bootstrap-launcher (Cludia 0547 + engine 2024 crux). The artifact is a STABLE SHELL that bakes a relocatable
# CPython + the fp-gated PEX source tree + tiny deps, materializes them into a per-user app dir on first run, and launches
# `python -m node.pex_join_out --gui` against that EDITABLE tree — so the app's own updater (check_and_apply/auto_update)
# self-heals on every future consensus fingerprint bump WITHOUT rebuilding this artifact.
#
# AV-FRIENDLY PACKAGING (Cludia 0551): ship as a Nuitka --standalone FOLDER inside a .zip, NOT a --onefile self-extractor.
# The onefile "unpack-to-%TEMP%-then-exec" pattern + any UPX compression are the #1 antivirus false-positive triggers (it
# deleted the first build on Master's laptop the instant it downloaded). A folder+launcher.exe in a zip trips heuristics far
# less and survives AV that kills a bare .exe. NO UPX. Everything else identical (bootstrap-launcher, fp-gate, badge,
# self-update, 9e7f2f15).
#
# THE ONE RULE (Cludia 0546): Nuitka is HOST-NATIVE — no cross-compile. pex-win builds ON Windows, pex-linux ON Ubuntu.
# Source pulled from /node_bundle + fp-gated to 9e7f2f15 so the baked tree provably hashes to the live fingerprint.
on:
  workflow_dispatch:
    inputs:
      expected_fp:
        description: 'consensus_fingerprint the baked source MUST hash to (fail the build otherwise)'
        required: true
        default: '9e7f2f1548091930647781e587c369887a0d4eac8a232971f7659e8ec46cd9de'
      bundle_url:
        description: 'canonical PEX source bundle'
        required: true
        default: 'https://compute.bull4life.com/node_bundle'

jobs:
  build:
    name: build-${{ matrix.zip }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04            # glibc 2.35 = max donor compat
            zip: pex-linux.zip
            exe: pex
            pbs: 'https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz'
            py: runtime/bin/python3
            appdir: $HOME/.local/share/PEX
          - runner: windows-latest
            zip: pex-win.zip
            exe: pex.exe
            pbs: 'https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-x86_64-pc-windows-msvc-install_only.tar.gz'
            py: runtime/python.exe
            appdir: $LOCALAPPDATA/PEX
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (launcher source)
        uses: actions/checkout@v4

      - name: Build-python (runs Nuitka — separate from the baked runtime)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch relocatable CPython (python-build-standalone) -> runtime/
        run: |
          set -e
          curl -fsSL "${{ matrix.pbs }}" -o pbs.tar.gz
          tar xzf pbs.tar.gz            # extracts a top-level python/ dir
          mv python runtime
          "${{ matrix.py }}" --version

      - name: Vendor the tiny deps into the baked runtime
        run: |
          set -e
          "${{ matrix.py }}" -m pip install --upgrade pip
          "${{ matrix.py }}" -m pip install cryptography certifi
          # pywebview enables the native window; best-effort (Linux donors fall back to terminal/headless cleanly)
          "${{ matrix.py }}" -m pip install pywebview || echo "pywebview install skipped (GUI falls back)"

      - name: Pack the runtime as one tarball (preserves symlinks + exec bits)
        run: tar czf runtime.tar.gz -C runtime .

      - name: Pull canonical PEX source + FP-GATE it to the expected fingerprint
        run: |
          set -e
          curl -fsSL "${{ github.event.inputs.bundle_url }}" -o bundle.tar.gz
          mkdir pexsrc && tar xzf bundle.tar.gz -C pexsrc
          test -f pexsrc/node/pex_join_out.py || { echo "bundle missing pex_join_out.py"; exit 1; }
          echo "=== computing consensus_fingerprint of the pulled tree ==="
          FP=$("${{ matrix.py }}" -c 'from node.consensus_fingerprint import consensus_fingerprint; print(consensus_fingerprint())' )
          echo "tree fp:     $FP"
          echo "expected fp: ${{ github.event.inputs.expected_fp }}"
          if [ "$FP" != "${{ github.event.inputs.expected_fp }}" ]; then
            echo "FP MISMATCH — refusing to bake a non-canonical tree"; exit 1
          fi
          printf '%s\n' "$FP" > pexsrc.fp
          tar czf pexsrc.tar.gz -C pexsrc .
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/pexsrc

      - name: Install Nuitka (build-python)
        run: python -m pip install "nuitka" ordered-set zstandard

      - name: Build the launcher (Nuitka --standalone FOLDER, no UPX, host-native)
        run: |
          set -e
          EXTRA=""
          if [ "${{ matrix.exe }}" = "pex.exe" ]; then EXTRA="--windows-console-mode=disable"; fi
          # --standalone (folder), NOT --onefile: no self-extractor pattern, no UPX -> far fewer AV false positives.
          # runtime + source baked as single tarballs (tar preserves symlinks + exec bits).
          # company/product/version metadata = what makes the working miner (Bull4LifeNode.exe) look like real software
          # to AV instead of an anonymous packed binary. This is the miner's actual AV-acceptance factor — mirror it.
          python -m nuitka --standalone --assume-yes-for-downloads $EXTRA \
            --company-name=Bull4Life --product-name=PEX \
            --product-version=1.0.0 --file-version=1.0.0.0 \
            --include-data-file=runtime.tar.gz=runtime.tar.gz \
            --include-data-file=pexsrc.tar.gz=pexsrc.tar.gz \
            --include-data-file=pexsrc.fp=pexsrc.fp \
            --output-filename="${{ matrix.exe }}" \
            launcher/pex_launcher.py
          # tidy folder name the user sees after unzip: pex/
          mv pex_launcher.dist pex
          ls -la "pex/${{ matrix.exe }}"

      - name: Self-check the artifact (materialize + verify fp == expected)
        run: |
          set -e
          rm -rf "${{ matrix.appdir }}" || true
          "./pex/${{ matrix.exe }}" --selfcheck || true     # GUI-subsystem exe: verdict goes to a file, not stdout
          for i in $(seq 1 30); do
            if [ -f "${{ matrix.appdir }}/selfcheck.result" ]; then break; fi
            sleep 3
          done
          echo "=== launcher.log ==="; cat "${{ matrix.appdir }}/launcher.log" 2>/dev/null || true
          echo "=== selfcheck.result ==="; cat "${{ matrix.appdir }}/selfcheck.result" 2>/dev/null || true
          echo "=== PROBE: materialized runtime python ==="
          RTPY="${{ matrix.appdir }}/${{ matrix.py }}"
          "$RTPY" --version 2>&1 | head -3 || echo "(runtime python --version FAILED)"
          grep -q "^PASS fp=${{ github.event.inputs.expected_fp }}" "${{ matrix.appdir }}/selfcheck.result" \
            || { echo "SELFCHECK FAILED — artifact does not materialize the canonical tree"; exit 1; }
          echo "SELFCHECK PASS — pex/${{ matrix.exe }} materializes ${{ github.event.inputs.expected_fp }}"

      - name: Zip the folder + emit .fp sidecar
        run: |
          set -e
          python -c "import shutil; shutil.make_archive('${{ matrix.zip }}'[:-4], 'zip', '.', 'pex')"
          cp pexsrc.fp "${{ matrix.zip }}.fp"
          ls -la "${{ matrix.zip }}" "${{ matrix.zip }}.fp"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: |
            ${{ matrix.zip }}
            ${{ matrix.zip }}.fp
          retention-days: 14
