name: Build PEX one-click fetch-launcher (pex-win.zip / pex-linux.zip)
# Cludia 0561 (Model A refined to FETCH-ON-EVERY-LAUNCH). Wraps her PROVEN launcher launcher/pex_launch.py into a frozen
# pex.exe that ships the embeddable CPython (pythonw.exe) BESIDE it. On EVERY launch the exe: GET /node_version (box fp) →
# GET /download/pex-node.tar.gz → verify the extracted tree's consensus_fingerprint == box fp (fork-safe) → atomic-swap
# into ~/.pex/current → exec `pythonw.exe -m node.pex_join_out` from there. So a cold start is ALWAYS current — no baked
# staleness, no stranding across a flip, and NEVER an exe rebuild for future flips (only the tiny launcher is frozen).
#
# CRITICAL (Cludia's _real_python + engine 2024 crux): when frozen, sys.executable == pex.exe, so the launcher execs the
# SIBLING pythonw.exe (embeddable python beside the exe), never itself. So pex.exe MUST be a self-contained --onefile
# (its own python internal — no sibling python3xx.dll to clash with the embeddable one in the same folder).
# AV-friendly (Master vetoed MS-submit + cert): NO UPX; company/product/version metadata; small launcher. NO cross-compile.
on:
  workflow_dispatch:
    inputs:
      box_url:
        description: 'the box the launcher fetches from at runtime'
        required: true
        default: 'https://compute.bull4life.com'

jobs:
  build:
    name: build-${{ matrix.zip }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            zip: pex-linux.zip
            exe: pex
            pbs: 'https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-x86_64-unknown-linux-gnu-install_only.tar.gz'
            pyx: python/bin/python3
          - runner: windows-latest
            zip: pex-win.zip
            exe: pex.exe
            pbs: 'https://github.com/indygreg/python-build-standalone/releases/download/20241016/cpython-3.12.7+20241016-x86_64-pc-windows-msvc-install_only.tar.gz'
            pyx: python/python.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (has launcher/pex_launch.py — Cludia's proven launcher)
        uses: actions/checkout@v4

      - name: Build-python (runs Nuitka)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the embeddable CPython that ships BESIDE the exe
        run: |
          set -e
          curl -fsSL "${{ matrix.pbs }}" -o pbs.tar.gz
          tar xzf pbs.tar.gz            # -> ./python/
          "${{ matrix.pyx }}" --version

      - name: Vendor deps into the embeddable python (runs the fetched node source)
        run: |
          set -e
          "${{ matrix.pyx }}" -m pip install --upgrade pip
          "${{ matrix.pyx }}" -m pip install cryptography certifi
          "${{ matrix.pyx }}" -m pip install pywebview || echo "pywebview optional (GUI falls back to terminal)"

      - name: Install Nuitka (build-python)
        run: python -m pip install "nuitka" ordered-set zstandard

      - name: Freeze the launcher -> pex.exe (onefile, metadata, no UPX) into nbuild/
        run: |
          set -e
          EXTRA=""
          if [ "${{ matrix.exe }}" = "pex.exe" ]; then EXTRA="--windows-console-mode=disable"; fi
          # entry = pex_entry.py (UTF-8/None-stdout-safe wrapper) which imports Cludia's pex_launch UNCHANGED.
          # --output-dir keeps the binary OUT of the CWD so a linux binary named `pex` can't collide with `mkdir pex`.
          python -m nuitka --onefile --assume-yes-for-downloads $EXTRA \
            --company-name=Bull4Life --product-name=PEX \
            --product-version=1.0.0 --file-version=1.0.0.0 \
            --include-module=pex_launch \
            --output-dir=nbuild --output-filename="${{ matrix.exe }}" \
            launcher/pex_entry.py
          ls -la "nbuild/${{ matrix.exe }}"

      - name: Package pex/ = pex.exe + embeddable python (pythonw BESIDE the exe)
        run: |
          set -e
          mkdir pex
          cp "nbuild/${{ matrix.exe }}" pex/
          cp -r python/. pex/                 # embeddable python flat beside the exe. Windows: pythonw.exe+python3xx.dll
                                              # at top (resolve fine). Linux: bin/python3 (rpath $ORIGIN/../lib -> pex/lib);
                                              # do NOT symlink a top-level python3 — zip flattens it to a broken-rpath ELF.
                                              # Cludia's _find_python tests candidates incl bin/, so bin/python3 is used.
          echo "package contents (top):"; ls pex | head
          # HARD sanity: RUN the sibling interpreter the launcher will use — catches bug1 (frozen has no 'secrets') +
          # bug2 (broken rpath) at BUILD time instead of on Master's machine.
          if [ "${{ matrix.exe }}" = "pex.exe" ]; then
            test -f pex/pythonw.exe || { echo "pythonw.exe missing"; exit 1; }
            pex/python.exe -c "import secrets,hashlib,ssl,cryptography; print('win sibling python OK', cryptography.__version__)"
          else
            pex/bin/python3 -c "import secrets,hashlib,ssl,cryptography; print('linux sibling python OK', cryptography.__version__)"
          fi

      - name: Self-check the LAUNCHER LOGIC against the live box (fetch+verify+extract, no GUI)
        run: |
          set -e
          # run pex_launch.fetch_current() with the EMBEDDABLE python (has deps) — proves fetch+fp-verify+atomic-extract
          # + box reachability + fp MATCH, without exec-ing the GUI (which would hang a headless runner). The frozen
          # end-to-end (pex.exe exec of the sibling python) is Cludia's live verify.
          export PEX_BOX_URL="${{ github.event.inputs.box_url }}"
          export PEX_LAUNCH_HOME="$PWD/.pexhome"
          export PYTHONUTF8=1 PYTHONIOENCODING=utf-8    # her _log prints em-dash/emoji — cp1252 would crash it
          "${{ matrix.pyx }}" -c "import sys,os; sys.path.insert(0,'launcher'); import pex_launch as L; py=L._find_python(); d=L.fetch_current(py); assert os.path.isfile(os.path.join(d,'node','pex_join_out.py')), 'no pex_join_out in fetched tree'; print('SELFCHECK FETCH+VERIFY OK ->', d)"
          echo "--- live box fp (stamped into .fp) ---"
          BOXFP=$("${{ matrix.pyx }}" -c "import json,urllib.request; print(json.loads(urllib.request.urlopen('${{ github.event.inputs.box_url }}/node_version',timeout=15).read()).get('consensus_fingerprint',''))")
          echo "$BOXFP" > "${{ matrix.zip }}.fp"
          echo "box fp: $BOXFP"
          test -n "$BOXFP"

      - name: Zip the package
        run: python -c "import shutil; shutil.make_archive('${{ matrix.zip }}'[:-4], 'zip', '.', 'pex')"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: |
            ${{ matrix.zip }}
            ${{ matrix.zip }}.fp
          retention-days: 14
